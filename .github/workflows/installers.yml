name: installer-checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  installer-tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install uv==0.12.24
      - run: uv sync --frozen
      - run: uv run pytest -q tests/test_easy_install.py tests/test_config.py
      - if: runner.os != 'Windows'
        run: bash -n install.sh start.sh start.command
      - if: runner.os == 'Windows'
        shell: powershell
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile("$PWD/install.ps1", [ref]$tokens, [ref]$errors) | Out-Null
          if ($errors.Count) { $errors | Out-String | Write-Error; exit 1 }
