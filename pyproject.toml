[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "nexolicitcr"
version = "0.9.0"
description = "Catálogo empresarial e ingesta de concursos públicos"
requires-python = ">=3.12,<3.14"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn>=0.34,<1", "jinja2>=3.1.6,<4",
  "pydantic-settings>=2.8,<3", "pymongo>=4.12,<5", "httpx>=0.28,<1",
  "beautifulsoup4>=4.13,<5", "pwdlib[argon2]>=0.2,<1",
  "python-multipart>=0.0.20,<1", "typer>=0.15,<1",
  "redis>=5,<7", "pypdf>=6,<7", "Pillow>=11,<13",
  # Windows no trae la base IANA; sin ella SICOP_TIMEZONE se rechaza como inválida.
  "tzdata>=2025.1",
]
[project.scripts]
nexolicit = "nexolicitcr.cli:app"
[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.11,<1", "mongomock>=4.3,<5", "pip-audit>=2.9,<3"]
[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: requires an explicitly configured isolated MongoDB database"]
[tool.ruff]
target-version = "py312"
line-length = 100
[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]
ignore = ["E501"]
[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "S105", "S106"]
