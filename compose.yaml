name: nexolicitcr
x-app: &app
  image: nexolicitcr:local
  build: .
  env_file: ${NEXO_ENV_FILE:-.env.atlas}
  environment:
    MONGO_MODE: atlas
  init: true
  restart: unless-stopped
  read_only: true
  tmpfs:
    - /tmp:size=64m,mode=1777
    - /app/var:size=256m,uid=10001,gid=10001,mode=0700
  security_opt:
    - no-new-privileges:true
  cap_drop: [ALL]
  mem_limit: 1536m
  cpus: 2
services:
  init-db:
    <<: *app
    command: ["/app/.venv/bin/nexolicit", "init-db"]
    restart: "no"
    healthcheck:
      disable: true
  web:
    <<: *app
    ports: ["127.0.0.1:${NEXO_HTTP_PORT:-8000}:8000"]
    command: ["/app/.venv/bin/nexolicit", "api", "--host", "0.0.0.0", "--no-worker"]
    depends_on:
      init-db:
        condition: service_completed_successfully
  worker:
    <<: *app
    command: ["/app/.venv/bin/nexolicit", "worker"]
    healthcheck:
      disable: true
    depends_on:
      init-db:
        condition: service_completed_successfully
  redis:
    image: redis:7.4-alpine
    profiles: [cache]
    command: ["redis-server", "--save", "", "--appendonly", "no", "--maxmemory", "128mb", "--maxmemory-policy", "allkeys-lru"]
    restart: unless-stopped
    read_only: true
    tmpfs: [/data]
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    user: redis
    mem_limit: 192m
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3
